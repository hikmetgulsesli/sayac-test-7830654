<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kinetik Sayaç</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#5516be",
                    "on-secondary": "#ffffff",
                    "secondary": "#6b38d4",
                    "on-background": "#171c23",
                    "surface-container-high": "#e4e8f3",
                    "surface-tint": "#494bd6",
                    "surface-container": "#eaeef9",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#23005c",
                    "surface-variant": "#dee2ed",
                    "secondary-container": "#8455ef",
                    "on-tertiary-fixed": "#301400",
                    "outline-variant": "#c7c4d7",
                    "on-secondary-container": "#fffbff",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#fffbff",
                    "inverse-primary": "#c0c1ff",
                    "background": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "primary-container": "#6063ee",
                    "on-surface-variant": "#464554",
                    "on-surface": "#171c23",
                    "on-primary-fixed": "#07006c",
                    "tertiary-container": "#b55d00",
                    "secondary-fixed-dim": "#d0bcff",
                    "outline": "#767586",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#eff3fe",
                    "primary": "#4648d4",
                    "surface-container-highest": "#dee2ed",
                    "on-tertiary-fixed-variant": "#703700",
                    "surface-dim": "#d6dae5",
                    "inverse-on-surface": "#edf1fc",
                    "surface-bright": "#f8f9ff",
                    "tertiary": "#904900",
                    "on-tertiary-container": "#fffbff",
                    "inverse-surface": "#2c3139",
                    "primary-fixed": "#e1e0ff",
                    "tertiary-fixed-dim": "#ffb783",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#e9ddff",
                    "tertiary-fixed": "#ffdcc5",
                    "surface": "#f8f9ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk", "sans-serif"],
                    "display": ["Space Grotesk", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["Inter", "sans-serif"]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex antialiased">
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full md:pr-64 relative">
<!-- TopAppBar Shared Component -->
<header class="sticky top-0 z-50 bg-surface flex justify-between items-center w-full px-6 py-4">
<div class="text-2xl font-bold tracking-tighter text-primary font-headline">
                Kinetik Sayaç
            </div>
<div class="flex items-center gap-2">
<button aria-label="Toggle Theme" class="text-on-surface-variant hover:bg-surface-variant/50 p-2.5 rounded-full transition-colors active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined">light_mode</span>
</button>
</div>
</header>
<!-- Counter Stage Area -->
<div class="flex-1 flex items-center justify-center p-6 md:p-12 relative overflow-hidden">
<!-- Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vmin] h-[80vmin] bg-primary-fixed/30 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<div class="flex flex-col items-center justify-center gap-16 md:gap-24">
<!-- Large Counter Display -->
<div class="font-display font-bold text-[120px] md:text-[200px] leading-none tracking-tighter text-on-surface select-none" style="text-shadow: 0 12px 48px rgba(70, 72, 212, 0.1);">
                    0
                </div>
<!-- Interaction Controls -->
<div class="flex flex-col md:flex-row items-center gap-6 md:gap-8">
<!-- Azalt Button (Secondary Style) -->
<button class="bg-surface outline outline-1 outline-outline-variant/20 text-on-surface rounded-md px-6 py-4 flex items-center justify-center gap-3 hover:-translate-y-0.5 active:scale-[0.98] transition-all shadow-[0_4px_16px_rgba(23,28,35,0.03)] w-48 md:w-auto">
<span class="material-symbols-outlined">remove</span>
<span class="font-label font-medium">Azalt</span>
</button>
<!-- Sıfırla Button (Secondary Style) -->
<button class="bg-surface outline outline-1 outline-outline-variant/20 text-on-surface-variant rounded-md px-6 py-4 flex items-center justify-center gap-3 hover:-translate-y-0.5 active:scale-[0.98] transition-all shadow-[0_4px_16px_rgba(23,28,35,0.03)] w-48 md:w-auto">
<span class="material-symbols-outlined">restart_alt</span>
<span class="font-label font-medium">Sıfırla</span>
</button>
<!-- Arttır Button (Primary Signature Style) -->
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full px-10 py-5 flex items-center justify-center gap-3 hover:-translate-y-1 active:scale-[0.98] transition-all shadow-[0_12px_32px_-8px_rgba(70,72,212,0.4)] w-56 md:w-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-label font-semibold text-lg tracking-wide">Arttır</span>
</button>
</div>
</div>
</div>
</main>
<!-- SideNavBar Shared Component -->
<aside class="hidden md:flex fixed right-0 top-0 h-full w-64 z-40 flex-col pt-20 bg-surface-container-lowest border-l-0 shadow-[0_0_40px_rgba(23,28,35,0.04)]">
<!-- Navigation Tabs -->
<nav class="flex flex-col mb-10 gap-1 px-2">
<!-- Active Item -->
<a class="bg-primary-fixed/40 text-on-primary-fixed rounded-lg mx-2 my-1 px-4 py-3 flex items-center gap-3 font-label font-medium text-sm tracking-wide transition-transform active:scale-98" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                 Sayaç
             </a>
<!-- Inactive Item -->
<a class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-lg mx-2 my-1 px-4 py-3 flex items-center gap-3 font-label font-medium text-sm tracking-wide" href="#">
<span class="material-symbols-outlined">settings</span>
                 Ayarlar
             </a>
</nav>
<!-- History Header -->
<div class="px-6 mb-5">
<h2 class="font-headline font-bold text-xl tracking-tight text-on-surface">Geçmiş</h2>
<p class="font-body text-sm text-on-surface-variant mt-1">İşlem kayıtları</p>
</div>
<!-- History List (No Dividers, Tonal Separation) -->
<div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col gap-4">
<!-- History Item (Positive) -->
<div class="bg-surface p-4 rounded-xl flex flex-col gap-1.5 outline outline-1 outline-outline-variant/10 shadow-sm">
<div class="flex items-center justify-between">
<span class="font-label font-semibold text-sm text-tertiary">Artırma</span>
<span class="font-headline font-bold text-xs text-on-surface-variant tracking-widest">0 → 1</span>
</div>
<div class="font-body text-xs text-outline mt-0.5">24.05.2024 14:30:05</div>
</div>
<!-- History Item (Neutral/Base) -->
<div class="bg-surface-container-low p-4 rounded-xl flex flex-col gap-1.5 outline outline-1 outline-outline-variant/5">
<div class="flex items-center justify-between">
<span class="font-label font-medium text-sm text-on-surface">Oturum Başlangıcı</span>
<span class="font-headline font-bold text-xs text-on-surface-variant tracking-widest">- → 0</span>
</div>
<div class="font-body text-xs text-outline mt-0.5">24.05.2024 14:30:00</div>
</div>
</div>
</aside>
</body></html>
