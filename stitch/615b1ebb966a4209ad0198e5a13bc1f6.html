<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kinetik Sayaç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#5516be",
                        "on-secondary": "#ffffff",
                        "secondary": "#6b38d4",
                        "on-background": "#171c23",
                        "surface-container-high": "#e4e8f3",
                        "surface-tint": "#494bd6",
                        "surface-container": "#eaeef9",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#23005c",
                        "surface-variant": "#dee2ed",
                        "secondary-container": "#8455ef",
                        "on-tertiary-fixed": "#301400",
                        "outline-variant": "#c7c4d7",
                        "on-secondary-container": "#fffbff",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-primary-container": "#fffbff",
                        "inverse-primary": "#c0c1ff",
                        "background": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "primary-container": "#6063ee",
                        "on-surface-variant": "#464554",
                        "on-surface": "#171c23",
                        "on-primary-fixed": "#07006c",
                        "tertiary-container": "#b55d00",
                        "secondary-fixed-dim": "#d0bcff",
                        "outline": "#767586",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#eff3fe",
                        "primary": "#4648d4",
                        "surface-container-highest": "#dee2ed",
                        "on-tertiary-fixed-variant": "#703700",
                        "surface-dim": "#d6dae5",
                        "inverse-on-surface": "#edf1fc",
                        "surface-bright": "#f8f9ff",
                        "tertiary": "#904900",
                        "on-tertiary-container": "#fffbff",
                        "inverse-surface": "#2c3139",
                        "primary-fixed": "#e1e0ff",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e9ddff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    "fontSize": {}
                },
            },
        }
    </script>
<style>
        /* Ambient shadow utility for FABs/Floating elements */
        .ambient-shadow {
            box-shadow: 0 8px 32px rgba(23, 28, 35, 0.06);
        }
        /* Ghost border utility */
        .ghost-border {
            box-shadow: inset 0 0 0 1px rgba(199, 196, 215, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased min-h-screen flex justify-center">
<!-- Mobile Container -->
<main class="w-full max-w-md bg-surface flex flex-col relative h-screen overflow-hidden shadow-2xl">
<!-- TopAppBar (From JSON) -->
<header class="bg-surface flex justify-between items-center w-full px-6 py-4 docked full-width top-0 z-10 relative">
<h1 class="text-2xl font-bold tracking-tighter text-primary font-headline">Kinetik Sayaç</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant focus:outline-none">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
</button>
<!-- Decorative subtle separation line using gradient -->
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-surface-variant/50 to-transparent"></div>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto flex flex-col pb-6">
<!-- Counter Stage -->
<section class="flex flex-col items-center justify-center pt-16 pb-12 px-6 flex-shrink-0">
<div class="relative flex items-center justify-center w-64 h-64 bg-surface-container-lowest rounded-full ambient-shadow mb-8">
<!-- Subtle inner glow effect -->
<div class="absolute inset-0 rounded-full bg-gradient-to-br from-primary/5 to-transparent"></div>
<span class="font-display font-bold text-[8rem] text-primary tracking-tighter leading-none relative z-10 drop-shadow-sm">7</span>
</div>
<div class="bg-secondary-fixed text-on-secondary-fixed px-4 py-1.5 rounded-full text-sm font-medium tracking-wide">
                    Aktif Değer
                </div>
</section>
<!-- Controls Area -->
<section class="px-6 flex flex-col gap-4 mb-12">
<!-- Primary Action -->
<button class="w-full h-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary flex items-center justify-center gap-2 ambient-shadow active:scale-95 transition-transform duration-150 ease-in-out focus:outline-none ring-2 ring-transparent focus:ring-primary-fixed-dim">
<span class="material-symbols-outlined text-3xl" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-headline font-bold text-xl tracking-wide">Artır</span>
</button>
<!-- Secondary Actions -->
<div class="flex gap-4 w-full">
<button class="flex-1 h-14 rounded-md bg-surface-container-lowest ghost-border text-on-surface flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150 ease-in-out focus:outline-none hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
<span class="font-medium">Azalt</span>
</button>
<button class="w-14 h-14 rounded-md bg-surface-container-lowest ghost-border text-error flex items-center justify-center active:scale-95 transition-transform duration-150 ease-in-out focus:outline-none hover:bg-error-container/30">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</button>
</div>
</section>
<!-- History Section (Visible at bottom of scroll) -->
<section class="px-6 flex-1 flex flex-col">
<!-- Header derived from SideNavBar JSON -->
<div class="mb-6 pl-2 border-l-4 border-secondary/20">
<h2 class="font-headline font-bold text-xl text-on-surface">Geçmiş</h2>
<p class="font-body text-sm text-on-surface-variant mt-0.5">İşlem kayıtları</p>
</div>
<div class="flex flex-col gap-3">
<!-- History Item 1 -->
<div class="bg-surface-container-lowest ghost-border rounded-xl p-4 flex justify-between items-center relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-lg" data-icon="add">add</span>
</div>
<div>
<p class="font-medium text-on-surface">Artırıldı</p>
<p class="text-xs text-on-surface-variant">14:22</p>
</div>
</div>
<span class="font-display font-bold text-lg text-primary">+1</span>
</div>
<!-- History Item 2 -->
<div class="bg-surface-container-low rounded-xl p-4 flex justify-between items-center relative">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-lg" data-icon="remove">remove</span>
</div>
<div>
<p class="font-medium text-on-surface">Azaltıldı</p>
<p class="text-xs text-on-surface-variant">14:15</p>
</div>
</div>
<span class="font-display font-bold text-lg text-on-surface-variant">-1</span>
</div>
<!-- History Item 3 -->
<div class="bg-surface-container-lowest ghost-border rounded-xl p-4 flex justify-between items-center relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-lg" data-icon="add">add</span>
</div>
<div>
<p class="font-medium text-on-surface">Artırıldı</p>
<p class="text-xs text-on-surface-variant">13:40</p>
</div>
</div>
<span class="font-display font-bold text-lg text-primary">+1</span>
</div>
</div>
<div class="mt-8 flex justify-center">
<button class="text-primary font-medium text-sm hover:underline focus:outline-none px-4 py-2 rounded-full hover:bg-surface-container-low transition-colors">
                        Tüm Geçmişi Gör
                    </button>
</div>
</section>
</div>
</main>
</body></html>
