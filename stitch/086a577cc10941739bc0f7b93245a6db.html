<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kinetik Sayaç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#5516be",
                        "on-secondary": "#ffffff",
                        "secondary": "#6b38d4",
                        "on-background": "#171c23",
                        "surface-container-high": "#e4e8f3",
                        "surface-tint": "#494bd6",
                        "surface-container": "#eaeef9",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#23005c",
                        "surface-variant": "#dee2ed",
                        "secondary-container": "#8455ef",
                        "on-tertiary-fixed": "#301400",
                        "outline-variant": "#c7c4d7",
                        "on-secondary-container": "#fffbff",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-primary-container": "#fffbff",
                        "inverse-primary": "#c0c1ff",
                        "background": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "primary-container": "#6063ee",
                        "on-surface-variant": "#464554",
                        "on-surface": "#171c23",
                        "on-primary-fixed": "#07006c",
                        "tertiary-container": "#b55d00",
                        "secondary-fixed-dim": "#d0bcff",
                        "outline": "#767586",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#eff3fe",
                        "primary": "#4648d4",
                        "surface-container-highest": "#dee2ed",
                        "on-tertiary-fixed-variant": "#703700",
                        "surface-dim": "#d6dae5",
                        "inverse-on-surface": "#edf1fc",
                        "surface-bright": "#f8f9ff",
                        "tertiary": "#904900",
                        "on-tertiary-container": "#fffbff",
                        "inverse-surface": "#2c3139",
                        "primary-fixed": "#e1e0ff",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e9ddff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body h-screen flex overflow-hidden relative selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Ambient Background Blobs for Dynamic Kineticist vibe -->
<div class="fixed top-[-15%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-primary-fixed-dim/40 blur-[100px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-10%] right-[10vw] w-[30vw] h-[30vw] rounded-full bg-secondary-fixed-dim/30 blur-[120px] pointer-events-none z-0"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center w-full px-8 py-5 glass-panel">
<div class="text-2xl font-bold tracking-tighter text-primary font-headline">Kinetik Sayaç</div>
<button aria-label="Toggle light mode" class="p-3 rounded-full hover:bg-surface-container transition-colors text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">light_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center h-full pt-20 lg:pr-80 relative z-10 w-full transition-all duration-300">
<!-- The Counter Stage -->
<div class="flex flex-col items-center justify-center space-y-16">
<div class="text-center space-y-2">
<span class="inline-block px-4 py-1.5 rounded-full bg-secondary-fixed text-on-secondary-fixed text-xs font-bold tracking-widest uppercase">Güncel Durum</span>
</div>
<!-- Signature Component: Counter -->
<div class="relative flex justify-center items-center">
<div class="text-[12rem] md:text-[16rem] leading-none font-bold font-display text-primary tracking-tighter drop-shadow-[0_20px_40px_rgba(70,72,212,0.15)]">
                    0
                </div>
</div>
<!-- Controls Panel -->
<div class="flex items-center space-x-6 md:space-x-10 p-4 rounded-[2.5rem] bg-surface-container-lowest/50 backdrop-blur-sm shadow-[0_32px_64px_-16px_rgba(0,0,0,0.05)]">
<!-- Decrement -->
<button class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center rounded-2xl bg-surface-container hover:bg-surface-container-high transition-transform duration-150 ease-in-out active:scale-95 text-on-surface-variant group">
<span class="material-symbols-outlined text-3xl group-hover:text-primary transition-colors">remove</span>
</button>
<!-- Increment (Primary Action) -->
<button class="w-24 h-24 md:w-28 md:h-28 flex items-center justify-center rounded-full bg-gradient-to-br from-primary to-primary-container shadow-[0_16px_32px_-8px_rgba(70,72,212,0.4)] hover:shadow-[0_24px_48px_-12px_rgba(70,72,212,0.5)] transition-all duration-150 ease-in-out active:scale-95 text-on-primary">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
</div>
</main>
<!-- SideNavBar (Geçmiş) -->
<aside class="fixed right-0 top-0 h-full w-full max-w-sm lg:w-80 z-40 flex flex-col pt-24 pb-8 bg-surface-container-lowest shadow-[-20px_0_40px_-10px_rgba(0,0,0,0.03)] transform translate-x-full lg:translate-x-0 transition-transform duration-300">
<!-- Navigation Tabs Container -->
<div class="px-6 mb-8 flex space-x-2">
<!-- Active Tab -->
<button class="flex-1 flex flex-col items-center justify-center space-y-1 bg-primary-fixed text-on-primary-fixed rounded-2xl p-4 transition-transform active:scale-95">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-medium text-sm">Sayaç</span>
</button>
<!-- Inactive Tab -->
<button class="flex-1 flex flex-col items-center justify-center space-y-1 text-on-surface-variant hover:bg-surface-container-low rounded-2xl p-4 transition-colors">
<span class="material-symbols-outlined text-2xl">settings</span>
<span class="font-medium text-sm">Ayarlar</span>
</button>
</div>
<!-- History Header -->
<div class="px-8 pb-4">
<h2 class="font-headline font-bold text-2xl text-on-surface tracking-tight">Geçmiş</h2>
<p class="text-sm text-on-surface-variant font-medium mt-1">İşlem kayıtları</p>
</div>
<!-- Empty State Content -->
<div class="flex-1 flex flex-col items-center justify-center px-8 text-center mt-[-4rem]">
<!-- Subtle Tonal Background for Illustration -->
<div class="w-40 h-40 rounded-full bg-surface-container flex items-center justify-center mb-6 shadow-inner">
<span class="material-symbols-outlined text-6xl text-outline-variant opacity-80" style="font-variation-settings: 'wght' 200;">receipt_long</span>
</div>
<h3 class="text-lg font-bold text-on-surface font-headline tracking-tight mb-2">Henüz işlem yapılmadı</h3>
<p class="text-sm text-on-surface-variant leading-relaxed max-w-[200px]">
                Sayaca ilk değerinizi ekleyerek kayıt oluşturmaya başlayın.
            </p>
</div>
</aside>
</body></html>
